name: Native codec experiment
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed origin whose CSP is preserved
        default: https://pr-594.abox-preview.pages.dev/
        required: true
permissions:
  contents: read
concurrency:
  group: native-codec-experiment-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            project: Linux Chromium native
          - engine: webkit
            project: Linux WebKit native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Run only independent native codec variants
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: npx playwright test --config=codec-experiment.config.ts --project="${{ matrix.project }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-codec-${{ matrix.engine }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
