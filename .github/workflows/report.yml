#
# Runs the QA suite across four runners at once and publishes one HTML report
# to the gh-pages branch, which GitHub Pages serves as a static site.
#
# SHARDED, AND WHY
#
# The suite is CPU-bound: video encodes, QR decodes, image stacking, across
# two browser engines. On one four-vCPU runner it took 15 to 19 minutes, and
# moving from two workers to four barely moved it - freed worker time was
# reabsorbed by the same four cores. The lever that works is more cores, and
# on hosted runners more cores means more runners: each job takes a slice of
# the tests, writes a blob report, and `merge-reports` in the job that
# publishes stitches the slices back into one HTML report.
#
# SLICED BY PROJECT FIRST, AND WHY
#
# `--shard` cuts the test list into equal counts, in file order. Four such
# quarters of the whole suite took 9, 16, 35 and 53 minutes: the tool specs
# sit together at the end of the list, WebKit takes three times as long as
# Chromium on every one of them, and a count says nothing about either. So
# the cut is by project first - each project is its own list, so a Safari
# job never waits on a Chrome quarter and the other way round - and each
# WebKit project is then cut four ways where each Chrome project is cut two,
# because that is the ratio the measured minutes came out at (162 and 154
# against 56 and 55). Twelve jobs, none predicted past fourteen minutes.
#
# The gh-pages branch holds one commit and no history - it used to keep every
# report ever published, which took this repository to eight hundred
# megabytes. It is force-pushed as an orphan every time, the report is
# published without its trace and video attachments, and the traces go to
# per-shard artifacts that expire instead.
#
# The workflow still fails (red X) when the suite fails, but only after
# publishing - a failing report is more useful on the page than no page.
#
# AGAINST A PREVIEW, AND ON A PULL REQUEST HERE
#
# The same run serves two more purposes, told apart in the `announce` job
# below and nowhere else.
#
# The website's Build workflow deploys every pull request to a preview of its
# own on Cloudflare Pages and dispatches this with `base_url`, `pr` and
# `sha`. That run tests the preview, keeps its report as an artifact rather
# than on gh-pages - which holds one report, production's, and would be
# overwritten - opens no issues, and reports its result as a commit status,
# `qa/preview`, on the website commit it was asked about, so it shows on the
# pull request as a check. Report-only for now; branch protection can
# require it once it has been green a while.
#
# A pull request in this repository runs the suite against production the
# same way - no publish, no issues, no status - which is the first time a
# change to a test is exercised on the machines the suite actually runs on
# before it lands on main.
#
# AND RE-RUNNING ONLY WHAT FAILED
#
# Dispatch with `rerun` set to the id of a run that went red, and this runs
# that run's failures and nothing else. Fourteen minutes becomes about three,
# most of which is installing browsers, because the projects that had no
# failures are skipped outright and the ones that did carry a filter.
#
# The filter is Playwright's own `--last-failed`, fed a `.last-run.json` that
# `scripts/failed-cases.mjs` writes out of the earlier run's blob reports. It
# selects by test id, so it still finds a test that has since moved down its
# file. `unexpected` only: a flaky test passed on a retry and is not what
# somebody dispatching this is looking at.
#
# A rerun publishes nothing, files no issues and sets no status. It is for
# looking at a failure, not for deciding anything. Two things it cannot do:
# the blob reports it reads expire after three days, and the ids it reads
# belong to the tests as they were named then - a rerun of a run from before a
# rename finds nothing and says so rather than passing quietly.
#

name: Report

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test'
        default: 'https://abox.tools/'
        required: false
      pr:
        description: 'The website pull request this site is a preview of, if it is one'
        default: ''
        required: false
      sha:
        description: 'The website commit to report the result on, if there is one'
        default: ''
        required: false
      rerun:
        description: 'Run only the cases that failed in this run id, for a closer look at them'
        default: ''
        required: false

permissions:
  contents: write
  # For the failure issues opened and closed after the report is published.
  issues: write

# A second production run landing mid-publish should not race it: it queues.
# A preview run is its own group per pull request, so it never waits on
# production, and a newer push to the same pull request cancels the older
# run - only the newest preview is worth checking. A rerun is its own group
# too: somebody looking at a failure should not be behind tonight's schedule.
concurrency:
  group: report-${{ github.event.inputs.rerun && format('rerun-{0}', github.event.inputs.rerun) || github.event.inputs.pr && format('pr-{0}', github.event.inputs.pr) || (github.event_name == 'pull_request' && format('qa-pr-{0}', github.event.pull_request.number)) || 'production' }}
  cancel-in-progress: ${{ github.event.inputs.pr != '' || github.event_name == 'pull_request' }}

jobs:
  # What this run is, decided once. `target` is the site under test and
  # `production` says whether the result may be published and filed; the
  # jobs below read these rather than re-deriving them from the event.
  announce:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.what.outputs.target }}
      production: ${{ steps.what.outputs.production }}
      pr: ${{ steps.what.outputs.pr }}
      sha: ${{ steps.what.outputs.sha }}
      rerun: ${{ steps.what.outputs.rerun }}
      label: ${{ steps.what.outputs.label }}
      # Always a JSON array, so the matrix's `if` can read it whether or not
      # the step that fills it in ran. Empty on a normal run, where the `if`
      # never looks past `rerun == ''` - but a fromJSON on an empty string is
      # not a chance worth taking on every scheduled run.
      projects: ${{ steps.cases.outputs.projects || '[]' }}
    steps:
      - name: What this run is
        id: what
        env:
          EVENT: ${{ github.event_name }}
          BASE_URL: ${{ github.event.inputs.base_url }}
          PR: ${{ github.event.inputs.pr }}
          SHA: ${{ github.event.inputs.sha }}
          RERUN: ${{ github.event.inputs.rerun }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          target="${BASE_URL:-https://abox.tools/}"
          production=false
          # A rerun is somebody looking at a failure. It publishes nothing,
          # files nothing and decides nothing, so it is never production
          # however it was aimed.
          if [ "$EVENT" != 'pull_request' ] && [ "$target" = 'https://abox.tools/' ] \
              && [ -z "$PR" ] && [ -z "$RERUN" ]; then
            production=true
          fi
          # What to call this run's kept report. One place, in a shell, rather
          # than a chain of ternaries in an artifact name.
          if   [ -n "$PR" ];                 then label="website-pr-$PR"
          elif [ "$EVENT" = 'pull_request' ]; then label="qa-pr-$PR_NUMBER"
          elif [ -n "$RERUN" ];               then label="rerun-$RERUN"
          else                                     label=production
          fi
          {
            echo "target=$target"
            echo "production=$production"
            echo "pr=$PR"
            echo "sha=$SHA"
            echo "rerun=$RERUN"
            echo "label=$label"
          } >> "$GITHUB_OUTPUT"
          echo "Testing $target (production: $production${PR:+, preview of website#$PR}${RERUN:+, re-running the failures of $RERUN})"

      # Only for a rerun, and only these four steps: the normal path must not
      # pay a checkout and an npm install before the twelve test jobs start.
      - uses: actions/checkout@v4
        if: steps.what.outputs.rerun != ''
      - uses: actions/setup-node@v4
        if: steps.what.outputs.rerun != ''
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        if: steps.what.outputs.rerun != ''

      # The earlier run's blob reports, merged and read for what went wrong.
      # Its own artifact rather than a job output, because a bad night can
      # fail hundreds of cases and an output has a size limit a list of ids
      # would eventually meet.
      - name: Work out which cases to re-run
        id: cases
        if: steps.what.outputs.rerun != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RERUN: ${{ steps.what.outputs.rerun }}
        run: |
          set -euo pipefail
          if ! gh run download "$RERUN" --repo "$GITHUB_REPOSITORY" \
              --pattern 'blob-report-*' --dir blobs; then
            echo "::error::Could not read run $RERUN. Its blob reports are kept for three days; after that there is nothing left to re-run from."
            exit 1
          fi

          # Named by slice on the way in, as the report job does: the blob
          # reporter names its file by shard index, so two slices of different
          # projects both write report-1.zip.
          mkdir -p all-blob-reports
          for dir in blobs/blob-report-*/; do
            slice=$(basename "$dir" | sed 's/^blob-report-//')
            for zip in "$dir"*.zip; do
              cp "$zip" "all-blob-reports/${slice}-$(basename "$zip")"
            done
          done

          PLAYWRIGHT_JSON_OUTPUT_NAME=merged.json \
            npx playwright merge-reports --reporter json ./all-blob-reports > /dev/null
          node scripts/failed-cases.mjs merged.json --out last-failed.json \
            > projects.json 2> cases.txt

          {
            echo "### Re-running what failed in [run $RERUN]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RERUN)"
            echo
            echo '```'
            cat cases.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat cases.txt

          projects=$(cat projects.json)
          if [ "$projects" = '[]' ]; then
            echo "::error::Run $RERUN has no unexpected failures, so there is nothing to re-run. (Flaky and skipped cases are deliberately not counted.)"
            exit 1
          fi
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

      - name: Hand the list to the test jobs
        if: steps.what.outputs.rerun != ''
        uses: actions/upload-artifact@v4
        with:
          name: last-failed
          path: last-failed.json
          retention-days: 1

      # Pending on the website commit from the start, so the pull request
      # shows the check as running rather than absent for the fourteen
      # minutes the suite takes. Without the token the status is skipped
      # and the run still happens; the result is then only in this
      # repository's Actions tab.
      - name: Mark the website commit as being tested
        if: steps.what.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_STATUS_TOKEN }}
          SHA: ${{ steps.what.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::notice::WEBSITE_STATUS_TOKEN is not set; the result will not appear on the website pull request. See cloudflare/README.md in the website repository, "Previews".'
            exit 0
          fi
          # A status that cannot be written must not stop the suite: the run is
          # the point, the status is how it is seen. A 403 here means the token
          # cannot write statuses on the website repository - wrong permission,
          # wrong repository, or an organisation approval still pending.
          if ! gh api --method POST "repos/A-Box-of-Tools/website/statuses/$SHA" \
              -f state=pending -f context=qa/preview -f target_url="$RUN_URL" \
              -f description='The browser suite is running against the preview' \
              > /dev/null 2> "$RUNNER_TEMP/status.err"; then
            echo "::warning::Could not set the qa/preview status on the website commit: $(tr -d '\n' < "$RUNNER_TEMP/status.err"). WEBSITE_STATUS_TOKEN needs Commit statuses: write on A-Box-of-Tools/website, and the organisation's approval if it asks for one. The suite runs regardless."
          fi

  test:
    needs: announce
    runs-on: ubuntu-latest
    name: test (${{ matrix.slice }})
    # A rerun only starts the projects that had a failure. The other eight or
    # ten slices would each spend a minute installing a browser to run nothing,
    # which is most of what a rerun would otherwise cost.
    if: >-
      ${{ needs.announce.outputs.rerun == ''
          || contains(fromJSON(needs.announce.outputs.projects), matrix.project) }}
    strategy:
      # One slice failing must not cancel the others: the report is only
      # worth publishing if it describes the whole suite.
      fail-fast: false
      matrix:
        include:
          - { slice: desktop-chrome-1, project: Desktop Chrome, shard: 1/2 }
          - { slice: desktop-chrome-2, project: Desktop Chrome, shard: 2/2 }
          - { slice: mobile-chrome-1,  project: Mobile Chrome,  shard: 1/2 }
          - { slice: mobile-chrome-2,  project: Mobile Chrome,  shard: 2/2 }
          - { slice: desktop-safari-1, project: Desktop Safari, shard: 1/4 }
          - { slice: desktop-safari-2, project: Desktop Safari, shard: 2/4 }
          - { slice: desktop-safari-3, project: Desktop Safari, shard: 3/4 }
          - { slice: desktop-safari-4, project: Desktop Safari, shard: 4/4 }
          - { slice: mobile-safari-1,  project: Mobile Safari,  shard: 1/4 }
          - { slice: mobile-safari-2,  project: Mobile Safari,  shard: 2/4 }
          - { slice: mobile-safari-3,  project: Mobile Safari,  shard: 3/4 }
          - { slice: mobile-safari-4,  project: Mobile Safari,  shard: 4/4 }
    steps:
      - uses: actions/checkout@v4

      # lib/tools.ts, lib/csp.ts and hasFilePicker() all read etoolbox's own
      # source at test time rather than duplicating it here - see lib/site.ts.
      - name: Check out etoolbox (source of truth for tool/CSP metadata)
        uses: actions/checkout@v4
        with:
          repository: A-Box-of-Tools/website
          path: etoolbox-src

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The engine this slice runs, and Chromium either way: a WebKit slice
      # still needs it, because lib/browser-video.ts borrows Chromium to
      # record the video fixtures WebKit cannot. On iOS every browser is
      # WebKit, Chrome included, so the WebKit slices are not a luxury - they
      # are what an iPhone visitor actually gets - but a Chrome slice has no
      # use for a WebKit download, and each engine is a minute of setup.
      - run: npx playwright install --with-deps ${{ contains(matrix.project, 'Safari') && 'chromium webkit' || 'chromium' }}

      - name: Fetch the cases this run is limited to
        if: needs.announce.outputs.rerun != ''
        uses: actions/download-artifact@v4
        with:
          name: last-failed

      # blob rather than html: the slices are stitched into one page by the
      # report job below. github stays so annotations still land on the
      # commit.
      #
      # A rerun adds the filter and --pass-with-no-tests. The filter is by
      # project as well as by test - an id is hashed with the project's own -
      # so a case that failed only on Mobile Safari leaves the other Safari
      # slices with nothing to do, and a slice that runs nothing is a normal
      # outcome here rather than a mistake.
      - name: Run this slice
        env:
          BASE_URL: ${{ needs.announce.outputs.target }}
          ETOOLBOX_DIR: ${{ github.workspace }}/etoolbox-src
          RERUN: ${{ needs.announce.outputs.rerun }}
        run: |
          set -euo pipefail
          only=''
          if [ -n "$RERUN" ]; then
            only='--last-failed --last-failed-file last-failed.json --pass-with-no-tests'
          fi
          npx playwright test --project="${{ matrix.project }}" \
            --shard=${{ matrix.shard }} $only --reporter=blob,github

      # The traces this slice kept for its failures. Out of git and expiring,
      # for the reasons in the header.
      - name: Keep the traces where they expire
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.slice }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      # Uploaded whether the slice passed or failed: the merged report has to
      # describe the failures, not omit the slices that had them.
      - name: Hand this slice's results to the merge
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.slice }}
          path: blob-report/
          retention-days: 3

  report:
    needs: [announce, test]
    # Runs whether the slices passed or not - see the header - but not if the
    # whole workflow was cancelled, and not if the slices never ran: a report
    # of nothing has nothing to publish, file or say.
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # merge-reports lives in @playwright/test; no browser is needed here,
      # so none is installed.
      - run: npm ci

      # One folder per slice, then one folder of zips named by slice: the blob
      # reporter names its file by shard index, so two slices of different
      # projects both write report-1.zip, and merging the artifacts into one
      # folder would keep only one of them.
      - name: Collect the slice reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: slice-reports
      - name: Name each report by its slice
        run: |
          set -euo pipefail
          mkdir -p all-blob-reports
          for dir in slice-reports/blob-report-*/; do
            slice=$(basename "$dir" | sed 's/^blob-report-//')
            for zip in "$dir"*.zip; do
              cp "$zip" "all-blob-reports/${slice}-$(basename "$zip")"
            done
          done
          ls -l all-blob-reports

      # Two reporters from the one merge: the HTML page people read, and a
      # JSON copy of the same results for the triage step to act on. The JSON
      # never leaves the runner.
      - name: Stitch them into one report
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: merged.json
        run: npx playwright merge-reports --reporter html,json ./all-blob-reports

      # Production's report only: gh-pages holds one report, and a preview's
      # would replace it. A preview's report is kept below instead.
      - name: Publish the report to gh-pages
        if: needs.announce.outputs.production == 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # The traces and videos go, before anything is committed.
          #
          # Playwright keeps a trace and a video for every failure, and they
          # are worth having - but they are megabytes each, and this branch was
          # keeping every one of them for ever. Thirty-two published reports had
          # taken the repository to eight hundred megabytes, most of it zips
          # nobody will open again, because a run that fails twice writes three
          # traces and the next run does not delete them. They are uploaded as
          # an artifact instead, which expires.
          rm -rf playwright-report/data
          rm -rf playwright-report/trace

          # A single commit with no history behind it, force-pushed.
          #
          # This branch holds one thing: the current report. Nobody diffs
          # yesterday's against today's, and keeping the old ones costs a clone
          # of the whole pile. --orphan every time means the branch is always
          # exactly one commit, whatever it held before.
          git worktree add --detach .publish
          git -C .publish checkout --orphan gh-pages
          git -C .publish rm -rq --cached . --ignore-unmatch
          find .publish -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +

          cp -a playwright-report/. .publish/
          touch .publish/.nojekyll

          git -C .publish add -A
          git -C .publish commit -q -m "Report from ${SHA:0:7}"
          git -C .publish push --force origin gh-pages
          du -sh .publish 2>/dev/null | sed 's/^/  published: /'

      # The traces the report no longer carries. Fourteen days rather than for
      # ever, and out of git entirely: a failure worth investigating is worth
      # investigating this week.

      # After publishing, deliberately: the report is the thing people were
      # promised, and a GitHub API problem here must not cost them the page.
      #
      # Only for runs against production from main. A dispatch aimed at a
      # staging URL, or a run from a branch, is somebody trying something -
      # and filing issues about a site nobody has deployed yet would teach
      # everyone to ignore the label.
      # Not production's report, so it lives with the run: a week, traces
      # included, which is what a failing pull request needs to be read.
      - name: Keep this run's report with the run
        if: needs.announce.outputs.production != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ needs.announce.outputs.label }}
          path: playwright-report/
          retention-days: 7

      # The result, on the website commit this run was asked about, so the
      # pull request shows it as a check with the run as its link. The
      # description carries the counts, because a status line that only says
      # "failure" sends everyone to the run to find out how badly.
      - name: Report the result on the website commit
        if: ${{ !cancelled() && needs.announce.outputs.sha != '' }}
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_STATUS_TOKEN }}
          SHA: ${{ needs.announce.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo '::notice::WEBSITE_STATUS_TOKEN is not set; the result is only here.'
            exit 0
          fi
          if [ "$OUTCOME" = 'success' ]; then state=success; else state=failure; fi
          counts=$(node -e '
            const s = require("./merged.json").stats;
            const parts = [`${s.expected} passed`];
            if (s.unexpected) parts.push(`${s.unexpected} failed`);
            if (s.flaky) parts.push(`${s.flaky} flaky`);
            if (s.skipped) parts.push(`${s.skipped} skipped`);
            process.stdout.write(parts.join(", "));
          ' 2>/dev/null || echo "the suite: $OUTCOME")
          if gh api --method POST "repos/A-Box-of-Tools/website/statuses/$SHA" \
              -f state="$state" -f context=qa/preview -f target_url="$RUN_URL" \
              -f description="$counts" > /dev/null 2> "$RUNNER_TEMP/status.err"; then
            echo "qa/preview on ${SHA:0:7}: $state - $counts"
          else
            echo "::warning::Could not set the qa/preview status on the website commit: $(tr -d '\n' < "$RUNNER_TEMP/status.err"). The result of this run: $state - $counts."
          fi

      - name: Open and close issues for what failed
        if: >-
          ${{ !cancelled()
              && github.ref == 'refs/heads/main'
              && needs.announce.outputs.production == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          QA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          QA_REPORT_URL: https://a-box-of-tools.github.io/qa/
          # Closing an issue is a claim that a test was watched passing. If a
          # shard was cancelled the report is partial, absence proves nothing,
          # and the script is told to open issues but never close them.
          QA_CAN_CLOSE: ${{ (needs.test.result == 'success' || needs.test.result == 'failure') && 'yes' || 'no' }}
        run: node scripts/triage-failures.mjs merged.json

      - name: Fail the workflow if the suite failed
        if: ${{ needs.test.result != 'success' }}
        run: |
          echo "::error::the QA suite failed - see the report: published for production, kept with this run for anything else."
          exit 1
