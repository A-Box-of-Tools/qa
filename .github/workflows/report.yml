name: Native codec experiment
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed origin whose CSP is preserved
        default: https://pr-594.abox-preview.pages.dev/
        required: true
      scope:
        description: native, crop, app, or identity (identity runs no encoder queries)
        default: native
        required: true
permissions:
  contents: read
concurrency:
  group: native-codec-experiment-${{ github.ref }}-${{ inputs.scope }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            project: Linux Chromium native
          - engine: webkit
            project: Linux WebKit native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Run only independent native codec variants
        if: inputs.scope == 'native'
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: npx playwright test --config=codec-experiment.config.ts --project="${{ matrix.project }}" --grep 'native: module:|native: classic:'
      - name: Compare cold crop settings and native recorder warm-up
        if: inputs.scope == 'crop'
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: npx playwright test --config=codec-experiment.config.ts --project="${{ matrix.project }}" --grep 'crop: module:'
      - name: Read only public runtime identity
        if: inputs.scope == 'identity'
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: npx playwright test --config=codec-experiment.config.ts --project="${{ matrix.project }}" --grep runtime-identity
      - name: Compare native initialization and actual Images output
        if: inputs.scope == 'app'
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: npx playwright test --config=codec-experiment.config.ts --project="${{ matrix.project }}" --grep 'app: '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-codec-${{ matrix.engine }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
