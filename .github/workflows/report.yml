#
# Runs the QA suite and publishes its HTML report to the gh-pages branch,
# which GitHub Pages serves as a static site.
#
# The branch holds one commit and no history. It used to keep every report
# ever published, each carrying Playwright's traces and videos - thirty-two of
# them had taken this repository to eight hundred megabytes, of zips nobody
# was going to open again. Nobody diffs yesterday's report against today's, so
# there is nothing to keep: it is force-pushed as an orphan every time, and the
# traces go to an artifact that expires.
#
# Runs on a schedule so the published report never goes stale even with no
# deploy to react to, on push to main so a change to the suite itself is
# reflected, and on workflow_dispatch for an on-demand run (optionally
# against a different site via the base_url input).
#
# The job still fails (red X in the Actions tab) when the suite fails, but
# only after publishing - a failing report is more useful on the page than
# no page at all.
#

name: Report

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test'
        default: 'https://abox.tools/'
        required: false

permissions:
  contents: write

# A second run landing mid-publish should not race it.
concurrency:
  group: report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # lib/tools.ts, lib/csp.ts and hasFilePicker() all read etoolbox's own
      # source (the tool list, its CSP allowlist, each tool's body.html) at
      # test time rather than duplicating it here - see lib/site.ts. Locally
      # that's a sibling checkout; on a runner nothing is there unless this
      # checks it out too and ETOOLBOX_DIR is pointed at it explicitly.
      - name: Check out etoolbox (source of truth for tool/CSP metadata)
        uses: actions/checkout@v4
        with:
          repository: A-Box-of-Tools/website
          path: etoolbox-src

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run the suite
        id: tests
        continue-on-error: true
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://abox.tools/' }}
          ETOOLBOX_DIR: ${{ github.workspace }}/etoolbox-src
        run: npx playwright test

      - name: Publish the report to gh-pages
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # The traces and videos go, before anything is committed.
          #
          # Playwright keeps a trace and a video for every failure, and they
          # are worth having - but they are megabytes each, and this branch was
          # keeping every one of them for ever. Thirty-two published reports had
          # taken the repository to eight hundred megabytes, most of it zips
          # nobody will open again, because a run that fails twice writes three
          # traces and the next run does not delete them. They are uploaded as
          # an artifact instead, which expires.
          rm -rf playwright-report/data
          rm -rf playwright-report/trace

          # A single commit with no history behind it, force-pushed.
          #
          # This branch holds one thing: the current report. Nobody diffs
          # yesterday's against today's, and keeping the old ones costs a clone
          # of the whole pile. --orphan every time means the branch is always
          # exactly one commit, whatever it held before.
          git worktree add --detach .publish
          git -C .publish checkout --orphan gh-pages
          git -C .publish rm -rq --cached . --ignore-unmatch
          find .publish -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +

          cp -a playwright-report/. .publish/
          touch .publish/.nojekyll

          git -C .publish add -A
          git -C .publish commit -q -m "Report from ${SHA:0:7}"
          git -C .publish push --force origin gh-pages
          du -sh .publish 2>/dev/null | sed 's/^/  published: /'

      # The traces the report no longer carries. Fourteen days rather than for
      # ever, and out of git entirely: a failure worth investigating is worth
      # investigating this week.
      - name: Keep the traces where they expire
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: traces
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail the job if the suite failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::the QA suite failed - see the published report for details."
          exit 1
