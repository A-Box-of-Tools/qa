#
# Takes stock of tools and specs against the website's main once a day, and
# keeps the issue that says which are out of step.
#
# Every production run of Report does this already, through the same script
# - scripts/take-stock.mjs, reading what tests/coverage.spec.ts and
# tests/tool-paths.spec.ts wrote on to the run. This exists for the days when
# nothing deploys and nothing else would look, and for a push to main here,
# which is usually a spec landing: the issue should close the hour it does,
# not the morning after.
#
# It is deliberately cheap. The two specs read the filesystem and never open
# a page, so no browser is needed and none is installed - the whole job is a
# checkout, an npm ci and about a second of work. That is why it can run
# daily without anyone thinking about it.
#
# BASE_URL is set so playwright.config.ts skips its webServer. Without it the
# config would try to build and serve etoolbox, which needs Python and
# PowerShell and is entirely beside the point here.
#

name: Coverage

on:
  schedule:
    # Daily. A tool without a spec is not an emergency - the production run
    # that saw it arrive has already said so - so this only has to be reliable.
    - cron: '0 7 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: coverage
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tool list comes from etoolbox itself, the same way every other
      # check here gets it - see lib/tools.ts.
      - name: Check out etoolbox
        uses: actions/checkout@v4
        with:
          repository: A-Box-of-Tools/website
          path: etoolbox-src

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # continue-on-error so that a structural failure - discovery finding no
      # tools at all - still reaches the step below, which reads the report
      # and says so, rather than ending the job with nothing written down.
      - name: Take stock
        continue-on-error: true
        env:
          ETOOLBOX_DIR: ${{ github.workspace }}/etoolbox-src
          BASE_URL: https://abox.tools/
        run: |
          npx playwright test tests/coverage.spec.ts tests/tool-paths.spec.ts \
            --project="Desktop Chrome" --reporter=json > result.json

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          QA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          QA_STOCK_ISSUE: 'yes'
        run: node scripts/take-stock.mjs result.json
